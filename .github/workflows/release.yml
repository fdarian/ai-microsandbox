name: release

on:
  push:
    branches: [main]
    paths: ['.changeset/**']

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for OIDC trusted publishing

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
        working-directory: ${{ runner.temp }}
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v1
        with:
          version: bun run --cwd packages/ai-microsandbox ci:version
          publish: bun run --cwd packages/ai-microsandbox ci:release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NO NODE_AUTH_TOKEN or NPM_TOKEN — authentication is via OIDC, not a secret
